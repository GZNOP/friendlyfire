[package]
name = "friendlyfire-server"
version = "0.1.0"
edition = "2024"

[dependencies]
friendlyfire-shared-lib = { path = "../shared" }
tokio = { version = "1.48.0", features = ["full"] }
anyhow = "1.0.100"
uuid = { version = "1.19.0", features = ["serde", "v4"] }
log = "0.4.29"
env_logger = "0.11.8"
url = "2.5.7"
async-trait = "0.1.89"
serde = { version = "1.0.228", features = ["derive"] }
jsonwebtoken = { version = "10.2.0", features = ["rust_crypto"] }
dotenv = "0.15.0"
argon2 = { version = "0.5.3", features = ["alloc"] }
axum = { version = "0.8.8", features = ["http2", "ws", "multipart"] }
futures-util = "0.3.31"
serde_json = "1.0.148"
